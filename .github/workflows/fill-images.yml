name: 自动填充文章配图

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'          # 有新文章时触发
  workflow_dispatch:        # 也支持手动触发

jobs:
  fill-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 需要写权限来 commit 图片

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node（理解图 HTML→PNG 用 Playwright）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装系统依赖（CJK 字体让中文渲染不丢字）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-wqy-zenhei

      - name: 安装图片生成依赖
        run: pip install --quiet openai python-dotenv matplotlib

      - name: 安装 Playwright + Chromium（理解图渲染层）
        run: |
          npm install -g playwright
          playwright install --with-deps chromium

      - name: 填充图片占位符
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python3 skills/scripts/fill_images.py posts/

      - name: 题图兜底（无 cover 的新文章补排版封面）
        # 为什么在这里：本步产出的 cover 会被本 job 的 commit 一起推上去，而
        # wechat-sync 串在本 job 完成之后才检出同步——所以封面一定在“首次同步”前就位，
        # 堵死“cover 迟到 → 同步回退取正文首图 → 写标记幂等锁死 → 好封面再也贴不上”这个时序坑。
        # 只补“没有 cover.* 且尚未同步（无 .wechat-sync.json 标记）”的文章：已有手工题图的不覆盖，
        # 历史已同步老文不动。render_cover.py 走 HTML→PNG，不依赖任何生图 API，必定出图。
        run: |
          python3 - <<'EOF'
          import subprocess, sys, datetime
          from pathlib import Path
          COVER_EXT = ('jpg', 'jpeg', 'png', 'gif')
          RECENT_DAYS = 3   # 与 sync_drafts.py --recent-days 3 对齐：只有这个窗口内的文章会被同步
          today = datetime.date.today()
          for ah in sorted(Path('posts').glob('*/*/article.html')):
              d = ah.parent
              try:                              # 只兜底最近 3 天的新文，绝不回填历史全站
                  post_date = datetime.date.fromisoformat(d.parent.name)
              except ValueError:
                  continue
              if (today - post_date).days > RECENT_DAYS:
                  continue
              if any((d / f'cover.{e}').exists() for e in COVER_EXT):
                  continue                      # 已有题图（含手工/摄影封面），不覆盖
              if (d / '.wechat-sync.json').exists():
                  continue                      # 已同步老文，封面早已定，不动
              print('题图兜底 ->', d)
              subprocess.run([sys.executable, 'skills/scripts/render_cover.py',
                              str(d), '--out', 'cover.jpg'], check=False)
          EOF

      - name: 生成 posts.json（加速首页加载）
        run: |
          python3 - <<'EOF'
          import json, re
          from pathlib import Path
          T = re.compile(r'<title>(.*?)</title>', re.I)
          posts = []
          for f in sorted(Path('posts').glob('*/*/article.html'), reverse=True):
              p = f.parts  # ('posts', date, slug, 'article.html')
              m = T.search(f.read_text(encoding='utf-8', errors='ignore'))
              posts.append({'title': m.group(1) if m else p[2], 'date': p[1], 'url': '/'.join(p)})
          Path('posts.json').write_text(json.dumps(posts, ensure_ascii=False), encoding='utf-8')
          print(f'posts.json: {len(posts)} 篇')
          EOF

      - name: Commit 图片和 posts.json
        run: |
          git config user.name  "AIWriter Bot"
          git config user.email "aiwriter-bot@users.noreply.github.com"
          git add posts/ posts.json
          git diff --staged --quiet \
            && echo "无变化" \
            || (git commit -m "auto: 填充配图 + 更新 posts.json [skip ci]" && git push)
